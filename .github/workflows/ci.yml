name: MAHASETU CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-ci:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff black

      - name: Check Code Formatting & Lint
        run: |
          ruff check backend/app
          black --check backend/app

      - name: Check Database Migrations
        env:
          JWT_SECRET: ci-test-secret-key-minimum-32-chars-long-for-validation
          ENVIRONMENT: development
          DEMO_MODE: "true"
        run: |
          alembic upgrade head

      - name: Run Pytest Suite
        env:
          JWT_SECRET: ci-test-secret-key-minimum-32-chars-long-for-validation
          ENVIRONMENT: development
          TESTING: "true"
          DEMO_MODE: "true"
        run: |
          python -m pytest backend/tests -v

  frontend-ci:
    name: Frontend Typecheck, Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Lint Frontend
        run: npx oxlint

      - name: Build Production Assets
        run: npm run build

  docker-build:
    name: Docker Images Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: |
          docker build -t mahasetu-backend:ci -f backend/Dockerfile .

      - name: Build Frontend Docker Image
        run: |
          docker build -t mahasetu-frontend:ci -f frontend/Dockerfile ./frontend
